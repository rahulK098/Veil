[project]
name = "veil"
version = "0.1.0"
description = "Policy-driven PII/secrets scrubber for LLM inputs, outputs, and logs"
readme = "README.md"
authors = [
    { name = "rahul kumar", email = "rahul.k@smarter.codes" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["pii", "privacy", "llm", "redaction", "presidio", "secrets"]
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "detect-secrets>=1.5",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Large spaCy model gives the NER recall the plan asks for; downloaded via `make model`.
eval = [
    "faker>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "faker>=24.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that load the spaCy model (deselect with -m 'not slow')",
    "eval: ship-gate evaluation runs that emit reports",
]

[tool.coverage.run]
source = ["veil"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Sentence templates read better on one line each.
"src/veil/evaluation/dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
