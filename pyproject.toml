[project]
name = "veil"
version = "0.1.0"
description = "Policy-driven PII/secrets scrubber for LLM inputs, outputs, and logs"
readme = "README.md"
authors = [
    { name = "rahul kumar", email = "rahul.k@smarter.codes" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["pii", "privacy", "llm", "redaction", "presidio", "secrets"]
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "detect-secrets>=1.5",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Everything needed to run the eval harness (eval/run.py) without the full dev toolchain.
# The spaCy model is not listed here: a direct-URL requirement cannot be published to PyPI,
# so library users install it with `python -m spacy download en_core_web_lg`.
eval = [
    "faker>=24.0",
]

[dependency-groups]
# Dependency groups are local-only (PEP 735) and never appear in published metadata, so the
# pinned model wheel below is safe here. Declaring it means `uv sync` installs it and stops
# pruning it, and CI restores it from the uv cache instead of re-downloading ~600 MB.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "faker>=24.0",
    "en-core-web-lg",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that load the spaCy model (deselect with -m 'not slow')",
    "eval: ship-gate evaluation runs that emit reports",
]

[tool.coverage.run]
source = ["veil"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Sentence templates read better on one line each.
"src/veil/evaluation/dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
